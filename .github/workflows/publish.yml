name: Publish to GitHub Packages

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@magicturtle'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Notify client repositories
        run: |
          echo "Published version ${{ steps.get_version.outputs.VERSION }}"

          # Trigger repository dispatch event to RiseUp Marketing
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/MagicTurtle-s/riseup-marketing-claude-deploy/dispatches \
            -d '{"event_type":"dependency-update","client_payload":{"package":"@magicturtle/claude-orchestrator","version":"${{ steps.get_version.outputs.VERSION }}"}}'

          echo "Notified RiseUp Marketing repo"

          # Add more client repos here as needed
          # curl -X POST ... (next client repo)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## Claude Orchestrator ${{ steps.get_version.outputs.VERSION }}

            Published to GitHub Packages as `@magicturtle/claude-orchestrator@${{ steps.get_version.outputs.VERSION }}`

            ### Installation

            ```bash
            npm install @magicturtle/claude-orchestrator@${{ steps.get_version.outputs.VERSION }}
            ```

            ### Features
            - Zero-overhead orchestration pattern
            - On-demand MCP delegation (HubSpot, SharePoint, Asana)
            - Parallel execution via Promise.all()
            - 8 MCP tools (4 execution + 4 delegation)

            ### Usage
            See [PROJECT.md](https://github.com/MagicTurtle-s/claude-code-mcp-bridge/blob/master/PROJECT.md) for details.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
